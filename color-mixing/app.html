<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Mixer</title>
    <style>
        :root {
            --bg-color: #f9f2f2;
            --text-color: #333;
            --border-color: #ccc;
            --shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .controls {
            margin-top: 25px;
        }

        #clear-btn {
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.1s, background-color 0.2s;
        }

        #clear-btn:active {
            transform: scale(0.95);
        }

        #clear-btn:hover {
            background-color: #ee5253;
        }

        .main-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        #result-square {
            width: 360px;
            height: 360px;
            border: 8px solid #333;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 20px;
            box-sizing: border-box;
            background-color: #fff;
            transition: background-color 0.3s ease;
            box-shadow: var(--shadow);
            position: relative;
        }

        #result-square .info-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0,0,0,0.7);
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            padding: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            border-radius: 10px;
        }

        /*#result-square:hover .info-overlay {
            opacity: 0.1;
        }*/

        #square-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            text-shadow: 0 0 3px white, 0 0 3px white;
        }

        .color-rows {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 15px;
        }

        .color-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .color-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .color-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-circle:hover {
            transform: scale(1.2);
            border-color: #333;
        }

        .color-name {
            font-size: 1rem;
            font-weight: bold;
        }

        .count {
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
            text-shadow: 0 0 3px white, 0 0 3px white;
            pointer-events: none;
            display: none;
        }

        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 10;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .color-circle:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div id="result-square">
            <span id="square-text">No colours added</span>
            <div id="square-overlay" class="info-overlay"></div>
        </div>

        <div class="color-rows">
            <div class="color-row" id="row-rainbow">
                <!-- ROYGBIV circles -->
            </div>
            <div class="color-row" id="row-extra">
                <!-- White and Black circles -->
            </div>

            <div class="controls">
                <button id="clear-btn">Clear</button>
            </div>
        </div>
    </div>

    

    <script>
        const rainbowColors = [
            { name: 'Red', hex: '#FF0000' },
            { name: 'Orange', hex: '#FFA500' },
            { name: 'Yellow', hex: '#FFFF00' },
            { name: 'Green', hex: '#008000' },
            { name: 'Blue', hex: '#0000FF' },
            { name: 'Indigo', hex: '#4B0082' },
            { name: 'Violet', hex: '#EE82EE' }
        ].map(c => ({...c, hex: c.hex.startsWith('#') ? c.hex : '#' + c.hex}));

        const extraColors = [
            { name: 'White', hex: '#FFFFFF' },
            { name: 'Black', hex: '#000000' }
        ];

        let addedColors = {};

        const resultSquare = document.getElementById('result-square');
        const squareText = document.getElementById('square-text');
        const squareOverlay = document.getElementById('square-overlay');
        const clearBtn = document.getElementById('clear-btn');
        const rainbowRow = document.getElementById('row-rainbow');
        const extraRow = document.getElementById('row-extra');

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function rgbToHex(r, g, b) {
            const toHex = (n) => Math.round(n).toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
        }

        function addColorToMix(hex) {
            addedColors[hex] = (addedColors[hex] || 0) + 1;
            updateMix();
        }

        function clearMix() {
            addedColors = {};
            updateMix();
        }

        function updateMix() {
            let totalWeight = 0;
            let sumR = 0;
            let sumG = 0;
            let sumB = 0;

            const keys = Object.keys(addedColors);

            // First, reset all counts and hide them
            document.querySelectorAll('.color-circle').forEach(circle => {
                const countSpan = circle.querySelector('.count');
                if (countSpan) {
                    countSpan.textContent = '0';
                    countSpan.style.display = 'none';
                }
            });

            if (keys.length === 0) {
                squareText.textContent = "No colours added";
                squareText.style.color = "black";
                resultSquare.style.backgroundColor = "#fff";
                squareOverlay.innerHTML = "";
                return;
            }

            for (const hex of keys) {
                const weight = addedColors[hex];
                const rgb = hexToRgb(hex);
                sumR += rgb.r * weight;
                sumG += rgb.g * weight;
                sumB += rgb.b * weight;
                totalWeight += weight;
            }

            const avgR = sumR / totalWeight;
            const avgG = sumG / totalWeight;
            const avgB = sumB / totalWeight;
            const avgHex = rgbToHex(avgR, avgG, avgB);
            const avgRgb = hexToRgb(avgHex);
            const brightness = (avgRgb.r * 299 + avgRgb.g * 587 + avgRgb.b * 114) / 1000;
            //const textColor = brightness >= 128 ? 'black' : 'white';

            resultSquare.style.backgroundColor = avgHex;
            squareText.textContent = avgHex.toUpperCase();
            //squareText.style.color = textColor;
            squareOverlay.innerHTML = "";

            // Now update the counts for the added colors
            document.querySelectorAll('.color-circle').forEach(circle => {
                const hex = circle.dataset.hex;
                const countSpan = circle.querySelector('.count');
                const count = addedColors[hex] || 0;

                if (count > 0) {
                    countSpan.textContent = count;
                    countSpan.style.display = 'block';
                }
            });
        }

        function createColorButton(color) {
            const container = document.createElement('div');
            container.className = 'color-container';

            const circle = document.createElement('div');
            circle.className = 'color-circle';
            circle.style.backgroundColor = color.hex;
            circle.dataset.hex = color.hex;
            circle.onclick = () => addColorToMix(color.hex);

            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            const rgb = hexToRgb(color.hex);
            const rgbStr = `rgb(${rgb.r},${rgb.g},${rgb.b})`;
            const hexStr = color.hex.toUpperCase();
            tooltip.innerHTML = `${rgbStr}<br>${hexStr}`;

            const nameLabel = document.createElement('div');
            nameLabel.className = 'color-name';
            nameLabel.textContent = color.name;

            const countSpan = document.createElement('span');
            countSpan.className = 'count';
            countSpan.textContent = '0';

            circle.appendChild(tooltip);
            circle.appendChild(countSpan);
            container.appendChild(circle);
            container.appendChild(nameLabel);
            return container;
        }

        function init() {
            rainbowColors.forEach(color => {
                rainbowRow.appendChild(createColorButton(color));
            });
            extraColors.forEach(color => {
                extraRow.appendChild(createColorButton(color));
            });
            clearBtn.onclick = clearMix;
        }

        init();
    </script>
</body>
</html>
